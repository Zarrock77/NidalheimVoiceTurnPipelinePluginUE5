name: Bug
description: Something doesn't behave the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Don't report a security vulnerability here.** See [SECURITY.md](../blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Commit or tag
      placeholder: "a short commit SHA, or a release tag"
    validations:
      required: true

  - type: input
    id: ue-version
    attributes:
      label: Unreal Engine version
      placeholder: "5.8.2"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered, from a clean project to the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Compiler/linker errors, log output, crash callstack. **Redact any tokens or API keys.**
    validations:
      required: true
